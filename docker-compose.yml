services:
  postgres:
    image: postgres:16-alpine
    container_name: race_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: racing
      POSTGRES_USER: racing
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racing -d racing"]
      interval: 5s
      timeout: 5s
      retries: 10

  mediamtx:
    image: bluenviron/mediamtx:1.12.3
    container_name: race_media
    restart: unless-stopped
    ports:
      - "8554:8554"   # RTSP
      - "1935:1935"   # RTMP (OBS)
      - "8888:8888"   # HTTP (HLS)
      - "8889:8889"   # WebRTC
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - mt_data:/data

  backend:
    build: ./backend
    container_name: race_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://racing:${DB_PASSWORD:-change_me}@postgres:5432/racing
      PORT: "3001"
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_in_prod}
      MEDIA_URL: http://mediamtx:8888
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: race_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change_me}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change_me}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: race_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_HLS_URL: /hls
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: race_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: racing
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-change_me}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  nginx:
    image: nginx:1.25-alpine
    container_name: race_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
      - mediamtx

volumes:
  pg_data:
  mt_data:
  redis_data:
  minio_data:
